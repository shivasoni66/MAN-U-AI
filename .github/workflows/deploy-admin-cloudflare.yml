name: Deploy Admin to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'packages/ui/**'
      - 'packages/web-core/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-admin-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-admin-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-admin:
    name: Build & Deploy Admin to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Production branch guard
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production branch guard failed: Deployments to production Cloudflare Pages are strictly restricted to refs/heads/main. Current ref is '${{ github.ref }}'."
            exit 1
          fi

      - name: Validate Cloudflare deployment prerequisites
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_ADMIN_PAGES_PROJECT }}
        run: |
          MISSING=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Required secret 'CLOUDFLARE_API_TOKEN' is missing or empty in GitHub Repository Secrets."
            MISSING=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Required secret 'CLOUDFLARE_ACCOUNT_ID' is missing or empty in GitHub Repository Secrets."
            MISSING=1
          fi
          if [ -z "$CLOUDFLARE_PROJECT_NAME" ]; then
            echo "::error::Required variable 'CLOUDFLARE_ADMIN_PAGES_PROJECT' is missing or empty in GitHub Repository Variables. Silent fallbacks are disabled. You must configure the verified Cloudflare Pages project name."
            MISSING=1
          fi
          if [ "$MISSING" -eq 1 ]; then
            echo "Deployment prerequisites validation failed. Please configure missing secrets and variables in GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Prerequisites verified: Project name is '$CLOUDFLARE_PROJECT_NAME', and Cloudflare credentials are provided."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin and workspace dependencies
        run: pnpm --filter @man-u-ai/admin... build

      - name: Validate build output
        run: |
          if [ ! -d "apps/admin/dist" ]; then
            echo "::error::Build verification failed: Directory apps/admin/dist does not exist"
            exit 1
          fi
          if [ ! -f "apps/admin/dist/index.html" ]; then
            echo "::error::Build verification failed: apps/admin/dist/index.html is missing"
            exit 1
          fi
          echo "Build output validated: apps/admin/dist ready for deployment"

      - name: Deploy to Cloudflare Pages via Wrangler
        run: |
          echo "Deploying to Cloudflare Pages project: $CLOUDFLARE_PROJECT_NAME (branch: main)"
          pnpm dlx wrangler@4.156.0 pages deploy apps/admin/dist \
            --project-name="$CLOUDFLARE_PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ vars.CLOUDFLARE_ADMIN_PAGES_PROJECT }}
