name: Deploy Admin to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      - 'packages/ui/**'
      - 'packages/web-core/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-admin-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-admin-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-admin:
    name: Build & Deploy Admin to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Admin and workspace dependencies
        run: pnpm --filter @man-u-ai/admin... build

      - name: Validate build output
        run: |
          if [ ! -d "apps/admin/dist" ]; then
            echo "Error: Directory apps/admin/dist does not exist"
            exit 1
          fi
          if [ ! -f "apps/admin/dist/index.html" ]; then
            echo "Error: apps/admin/dist/index.html is missing"
            exit 1
          fi
          echo "Build output validated: apps/admin/dist ready for deployment"

      - name: Deploy to Cloudflare Pages via Wrangler
        run: |
          PROJECT_NAME="${{ vars.CLOUDFLARE_ADMIN_PAGES_PROJECT || 'manuai-admin' }}"
          echo "Deploying to Cloudflare Pages project: $PROJECT_NAME (branch: main)"
          pnpm dlx wrangler pages deploy apps/admin/dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
